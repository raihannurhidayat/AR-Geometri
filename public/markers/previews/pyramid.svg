  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#fbbf24" stroke-width="8" stroke-dasharray="16 12"/>
  <circle cx="50" cy="50" r="14" fill="#fbbf24"/>
  <circle cx="350" cy="50" r="14" fill="#fbbf24"/>
  <circle cx="50" cy="350" r="14" fill="#fbbf24"/>
  <circle cx="350" cy="350" r="14" fill="#fbbf24"/>
