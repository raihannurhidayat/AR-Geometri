<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#0f172a" rx="16"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="16 12"/>
  <circle cx="50" cy="50" r="14" fill="#38bdf8"/>
  <circle cx="350" cy="50" r="14" fill="#38bdf8"/>
  <circle cx="50" cy="350" r="14" fill="#38bdf8"/>
  <circle cx="350" cy="350" r="14" fill="#38bdf8"/>
  <!-- Cube Isometric Diagram -->
  <g transform="translate(200, 190) scale(1.1)">
    <!-- Top Face -->
    <polygon points="0,-80 70,-40 0,0 -70,-40" fill="#60a5fa" stroke="#1e293b" stroke-width="3"/>
    <!-- Left Face -->
    <polygon points="-70,-40 0,0 0,80 -70,40" fill="#2563eb" stroke="#1e293b" stroke-width="3"/>
    <!-- Right Face -->
    <polygon points="0,0 70,-40 70,40 0,80" fill="#1d4ed8" stroke="#1e293b" stroke-width="3"/>
  </g>
  <text x="200" y="325" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="800" font-size="24" letter-spacing="2">MARKER 01: KUBUS</text>
  <text x="200" y="350" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">AR GEOMETRI • TARGET INDEX 0</text>
</svg>
